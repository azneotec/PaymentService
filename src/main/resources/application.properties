spring.application.name=payment-service

# 8005 for a single instance; start a second instance with SERVER_PORT=9005 so both register with Eureka
# under the same name (payment-service) on different ports.
server.port=${SERVER_PORT:8005}

# Local overrides: an optional .env in the working directory (see .env.example) feeds the ${...} placeholders
# below, so `./mvnw spring-boot:run` and `make run` read the same file. Real environment variables win over it.
# Values must be unquoted: the file is read as .properties here, but sourced by the shell in the Makefile.
spring.config.import=optional:file:.env[.properties]

# Transaction log (MySQL). Defaults are for local dev (the root compose MySQL on 3307); override via env vars
# elsewhere. createDatabaseIfNotExist covers a MySQL volume that was created before this service existed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/payment_service?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:migration

# Stripe is the default gateway, so its key is required (the service refuses to start without STRIPE_API_KEY).
# Stripe signs its webhooks with stripe.webhook.secret (Dashboard > Developers > Webhooks); empty rejects every
# Stripe webhook.
stripe.apiKey=${STRIPE_API_KEY}
# Razorpay is the alternative gateway (move @Primary to RazorpayPaymentGateway): its keys are only needed then.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Razorpay links expire after razorpay.link.expiry (Razorpay needs at least 15 minutes);
# razorpay.callback-url, when set, is where the customer lands after paying.
razorpay.currency=INR
razorpay.link.expiry=24h
razorpay.callback-url=${RAZORPAY_CALLBACK_URL:}
stripe.currency=inr
stripe.redirect-url=${STRIPE_REDIRECT_URL:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# A standalone run has no Eureka server: EUREKA_CLIENT_ENABLED=false (in .env) switches the client off.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Callers are authenticated by user-auth-service (looked up in Eureka), which validates their bearer token.
payment.clients.connect-timeout=2s
payment.clients.read-timeout=5s

# Kafka (localhost:9092 by default, the root compose broker). OrderManagementService asks for a payment on
# payment-requested; this service answers on payment-result (link created, paid, failed). Producers are
# best-effort-bounded so an unreachable broker does not hold a request for the default 60s metadata wait.
payment.topics.payment-requested=payment-requested
payment.topics.payment-result=payment-result
# The receipt email goes out on the topic NotificationService already sends mail from (order-notification).
payment.topics.receipt-notification=order-notification
# Sender address on the receipt email; NotificationService uses it as the SMTP login.
payment.notification.sender=azneotech@gmail.com
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.max.block.ms=3000

# Razorpay signs every webhook with this secret (Dashboard > Webhooks). Empty rejects all webhooks.
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
